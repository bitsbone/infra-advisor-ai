apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-api-dotnet-config
  namespace: infra-advisor
  labels:
    app: agent-api-dotnet
data:
  # Unified service tagging — DD agent reads these for container metadata. They
  # do not require the DD .NET tracer to be present; they're equivalent to (and
  # redundant with) the OTEL_RESOURCE_ATTRIBUTES below, but DD's autodiscovery
  # uses both paths.
  DD_ENV: "dev"
  DD_SERVICE: "infra-advisor-agent-api-dotnet"
  DD_VERSION: "latest"
  DD_SITE: "us3.datadoghq.com"

  # The application-owned OpenTelemetry SDK remains the sole APM trace source.
  # Datadog's injected .NET profiler is present only for App and API Protection.
  # DD_APM_TRACING_ENABLED is the supported standalone-AAP switch: unlike
  # DD_TRACE_ENABLED=false, it keeps the security runtime active while limiting
  # Datadog tracer output to the minimum security telemetry AAP requires.
  DD_APPSEC_ENABLED: "true"
  DD_API_SECURITY_ENABLED: "true"
  DD_APM_TRACING_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://datadog-agent.datadog.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "infra-advisor-agent-api-dotnet"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev,service.version=latest,service.name=infra-advisor-agent-api-dotnet"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  # Toggle: set to "true" to emit APM + LLMObs spans for Kafka eval-loop runs.
  # Default false because the eval load-generator runs continuously and floods
  # the trace interface, drowning out real UI-originated queries.
  KAFKA_TRACING_ENABLED: "false"
  AZURE_OPENAI_DEPLOYMENT: "gpt-5.4-mini"
  AZURE_OPENAI_EVAL_DEPLOYMENT: "gpt-4.1-mini"
  # Audio attachments are transcribed directly against this Azure OpenAI Whisper
  # deployment — the blob URL (uploaded via this service's own /media/upload,
  # or the Python agent-api's, depending on which pipeline was selected) is
  # downloaded and passed to the transcription call.
  AZURE_OPENAI_WHISPER_DEPLOYMENT: "whisper"
  # Chat attachment upload (POST /media/upload) — image/audio blobs land in this
  # container, addressed to callers via a read-only SAS URL minted at upload time.
  # Same container the Python agent-api uses — see Services/MediaService.cs.
  AZURE_STORAGE_MEDIA_CONTAINER: "chat-media"
  MEDIA_SAS_EXPIRY_HOURS: "168"
  # RetrievalService uses this Azure OpenAI deployment for query + corpus
  # embeddings. Must exist in the Azure OpenAI resource — create via
  # `az cognitiveservices account deployment create` if missing.
  # text-embedding-3-small is the cheapest sensible default (1536 dims).
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  AVAILABLE_MODELS: "gpt-5.4-mini,gpt-4.1-mini,gpt-4.1"
  MCP_SERVER_URL: "http://mcp-server-dotnet.infra-advisor.svc.cluster.local:8000/mcp"
  REDIS_HOST: "redis.infra-advisor.svc.cluster.local"
  REDIS_PORT: "6379"
  LOG_LEVEL: "Information"
  ASPNETCORE_ENVIRONMENT: "Production"
  # External-evaluations sample rate (fraction of /query calls scored by
  # IResponseEvaluator implementations and POSTed to DD's eval-metric API).
  # Set to "0" to disable, "1" to score every call. 0.1 = 10% sampling.
  EVAL_SAMPLE_RATE: "0.1"
  # Fetch the system prompt from DD's (preview) Prompt Registry at startup
  # instead of the hardcoded AgentSystemPrompt constant in Program.cs. Off by
  # default — the registry API is still "unstable"/preview status, and the
  # hardcoded constant always remains the fail-open fallback either way. See
  # Services/DatadogPromptManagementClient.cs.
  DD_PROMPT_MANAGEMENT_ENABLED: "false"
