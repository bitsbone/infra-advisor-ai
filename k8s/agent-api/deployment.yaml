apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  namespace: infra-advisor
  labels:
    app: agent-api
    tags.datadoghq.com/env: dev
    tags.datadoghq.com/service: infra-advisor-agent-api
    tags.datadoghq.com/version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
        # The Python image already pins ddtrace, but this opt-in label lets the
        # Admission Controller inject the Agent connection and unified tags.
        admission.datadoghq.com/enabled: "true"
        tags.datadoghq.com/env: dev
        tags.datadoghq.com/service: infra-advisor-agent-api
        tags.datadoghq.com/version: latest
      annotations:
        ad.datadoghq.com/agent-api.logs: "[{\"source\":\"python\",\"service\":\"infra-advisor-agent-api\"}]"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: agent-api
          image: ghcr.io/bitsbone/infra-advisor-ai/agent-api:latest
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          envFrom:
            - configMapRef:
                name: agent-api-config
            - secretRef:
                name: agent-api-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /livez
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /livez
              port: 8001
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
