apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-api-config
  namespace: infra-advisor
  labels:
    app: agent-api
data:
  DD_ENV: "dev"
  DD_SERVICE: "infra-advisor-agent-api"
  DD_VERSION: "latest"
  DD_SITE: "us3.datadoghq.com"
  DD_AGENT_HOST: "datadog-agent.datadog.svc.cluster.local"
  DD_TRACE_AGENT_PORT: "8126"
  DD_DOGSTATSD_PORT: "8125"
  DD_LOGS_INJECTION: "true"
  DD_TRACE_SAMPLE_RATE: "1.0"
  # Drop kubelet probes before trace ingestion while retaining 100% sampling
  # for user/API traffic in this observability demo.
  DD_TRACE_SAMPLING_RULES: '[{"resource":"GET /livez","sample_rate":0.0},{"resource":"GET /readyz","sample_rate":0.0},{"sample_rate":1.0}]'
  DD_RUNTIME_METRICS_ENABLED: "true"
  DD_DATA_STREAMS_ENABLED: "true"
  # The Kafka consumer (kafka_consumer.py) polls infra.query.events roughly
  # once/second, 24/7, waiting for the load-generator CronJob's every-5-min
  # burst. ddtrace's kafka integration defaults to tracing every poll() call
  # including empty ones (DD_KAFKA_EMPTY_POLL_ENABLED default: true), so this
  # was flooding APM with a ~1s kafka.consume span for nearly every poll.
  # Real message consumption still traces normally with this disabled.
  DD_KAFKA_EMPTY_POLL_ENABLED: "false"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  DD_LLMOBS_ENABLED: "true"
  DD_LLMOBS_ML_APP: "infra-advisor-ai"
  DD_LLMOBS_AGENTLESS_ENABLED: "false"
  DD_CODE_ORIGIN_FOR_SPANS_ENABLED: "true"
  DD_TRACE_ENABLED: "true"
  # App and API Protection runs inside the same pinned ddtrace process as APM.
  # Keep API Security explicit even though current ddtrace 4.x defaults it on,
  # so this public example fails visibly if the security contract is changed.
  DD_APPSEC_ENABLED: "true"
  DD_API_SECURITY_ENABLED: "true"
  # AI Guard: automatic LangChain integration (ddtrace>=3.14, langchain>=0.1.20 —
  # both satisfied). Patches BaseTool.invoke/ainvoke + chat model calls with no
  # code changes. DD_APP_KEY (required by the integration) lives in agent-api-secret.
  DD_AI_GUARD_ENABLED: "true"
  # Fetch prompts from DD's (preview) Prompt Registry at call time instead of
  # the hardcoded strings in agent.py/observability/llm_obs.py. Off by
  # default — the registry API is still "unstable"/preview status, and the
  # hardcoded strings always remain the fail-open fallback either way. See
  # observability/prompts.py and scripts/seed_prompt_registry.py.
  DD_PROMPT_MANAGEMENT_ENABLED: "false"
  AZURE_OPENAI_DEPLOYMENT: "gpt-5.4-mini"
  # Honor Azure Retry-After responses before surfacing a retryable chat error.
  AZURE_OPENAI_MAX_RETRIES: "5"
  AZURE_OPENAI_EVAL_DEPLOYMENT: "gpt-4.1-mini"
  # The evaluator shares model capacity with chat; sample it to protect users.
  EVAL_SAMPLE_RATE: "0.1"
  AZURE_OPENAI_WHISPER_DEPLOYMENT: "whisper"
  AVAILABLE_MODELS: "gpt-5.4-mini,gpt-4.1-mini,gpt-4.1"
  # Chat attachment upload (POST /media/upload) — image/audio blobs land in this
  # container, addressed to callers via a read-only SAS URL minted at upload time.
  AZURE_STORAGE_MEDIA_CONTAINER: "chat-media"
  MEDIA_SAS_EXPIRY_HOURS: "168"
  MCP_SERVER_URL: "http://mcp-server.infra-advisor.svc.cluster.local:8000/mcp"
  REDIS_HOST: "redis.infra-advisor.svc.cluster.local"
  REDIS_PORT: "6379"
  LOG_LEVEL: "INFO"
  DD_DBM_PROPAGATION_MODE: "full"
