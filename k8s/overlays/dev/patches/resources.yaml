# Trimmed requests so dev (~510m CPU total, data services included) fits in
# the ~800m the three-node cluster has spare. Limits stay as in the bases, so
# dev can still burst; under pressure it's dev that stays Pending, not prod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  namespace: infra-advisor
spec:
  template:
    spec:
      containers:
        - name: agent-api
          resources:
            requests: { cpu: 150m, memory: 384Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api-dotnet
  namespace: infra-advisor
spec:
  template:
    spec:
      containers:
        - name: agent-api-dotnet
          resources:
            requests: { cpu: 100m, memory: 256Mi }
---
apiVersion: apps/v1
