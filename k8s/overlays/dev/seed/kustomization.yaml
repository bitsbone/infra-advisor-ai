# Dev seed Job — applied on its own by `make seed-dev` (Jobs are immutable, so
# the target deletes the previous run first). Not part of k8s/overlays/dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra-advisor-dev
resources:
  - job.yaml
configMapGenerator:
  - name: seed-dev-script
    files:
      - seed_dev.py
