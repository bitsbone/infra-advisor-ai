apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-api-config
  namespace: infra-advisor
data:
  LOG_LEVEL: "INFO"
  DD_SERVICE: "infra-advisor-auth-api"
  DD_ENV: "dev"
  DD_VERSION: "latest"
  DD_SITE: "us3.datadoghq.com"
  DD_AGENT_HOST: "datadog-agent.datadog.svc.cluster.local"
  DD_TRACE_AGENT_PORT: "8126"
  DD_TRACE_SAMPLE_RATE: "1.0"
  DD_TRACE_SAMPLING_RULES: '[{"resource":"GET /livez","sample_rate":0.0},{"resource":"GET /readyz","sample_rate":0.0},{"sample_rate":1.0}]'
  DD_LOGS_INJECTION: "true"
  DD_CODE_ORIGIN_FOR_SPANS_ENABLED: "true"
  DD_DBM_PROPAGATION_MODE: "full"
  SMTP_HOST: "mailpit.infra-advisor.svc.cluster.local"
  SMTP_PORT: "1025"
  SMTP_FROM: "infra-advisor-ai@demo.local"
  SMTP_TLS: "false"
  APP_BASE_URL: "https://infra-advisor-ai.bitsbone.com"
  # CORS allow-list. Comma-separated origins. Browser blocks any request from
  # an origin not in this list.
  ALLOWED_ORIGINS: "https://infra-advisor-ai.bitsbone.com"
  # Email domain allowed to register. Change to restrict to a different org.
  ALLOWED_DOMAIN: "@datadoghq.com"
