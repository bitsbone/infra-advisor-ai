# TEMPLATE FILE — contains placeholder values only.
# Do NOT put real credentials here. This file is committed to the repo.
#
# To create the real secret at deploy time, run:
#   make create-agent-api-secret
# with the following vars set in your environment (or .env):
#   AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY
#   DATABASE_URL — postgresql://user:pass@postgres.infra-advisor.svc.cluster.local:5432/infraadvisor
#                  (optional: omit to disable conversation persistence)
#   DD_APP_KEY — Datadog application key, required by the AI Guard LangChain
#                auto-integration (DD_API_KEY is not provisioned on this service
#                today; AI Guard also needs it — see create-agent-api-secret)
#   AZURE_STORAGE_CONNECTION_STRING — connection string for the stinfraadv<env>
#                storage account (chat-media container); this is the sole
#                secret-bearing dependency for POST /media/upload since the
#                connection string's embedded account key signs read SAS URLs
#   AZURE_OPENAI_WHISPER_ENDPOINT, AZURE_OPENAI_WHISPER_API_KEY — separate
#                Cognitive Services account (different region — see
#                infra/bicep/modules/azure-openai.bicep for why whisper can't
#                live on the main AZURE_OPENAI_ENDPOINT account) used to
#                transcribe voice chat attachments
apiVersion: v1
kind: Secret
metadata:
  name: agent-api-secret
  namespace: infra-advisor
type: Opaque
stringData:
  AZURE_OPENAI_ENDPOINT: PLACEHOLDER
  AZURE_OPENAI_API_KEY: PLACEHOLDER
  DATABASE_URL: PLACEHOLDER
  DD_API_KEY: PLACEHOLDER
  DD_APP_KEY: PLACEHOLDER
  AZURE_STORAGE_CONNECTION_STRING: PLACEHOLDER
  AZURE_OPENAI_WHISPER_ENDPOINT: PLACEHOLDER
  AZURE_OPENAI_WHISPER_API_KEY: PLACEHOLDER
