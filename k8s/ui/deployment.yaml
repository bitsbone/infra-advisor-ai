apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: infra-advisor
  labels:
    app: ui
    tags.datadoghq.com/env: prod
    tags.datadoghq.com/service: infra-advisor-ui
    tags.datadoghq.com/version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/service: infra-advisor-ui
        tags.datadoghq.com/version: latest
      annotations:
        ad.datadoghq.com/ui.logs: '[{"source":"nginx","service":"infra-advisor-ui"}]'
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ui
          image: ghcr.io/bitsbone/infra-advisor-ai/ui:latest
          ports:
            - containerPort: 80
              name: http
          # Rendered into nginx's config and /env-config.js at container start
          # (services/ui/nginx/default.conf.template), so one image serves any
          # namespace. Both come from the pod itself, so the env label above
          # stays the single source of truth for RUM's env and the dev banner.
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # nginx master process must run as root to bind port 80.
          # allowPrivilegeEscalation: false prevents setuid/setgid binary abuse.
          securityContext:
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
