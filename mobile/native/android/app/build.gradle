plugins {
    id "com.android.application"
    id "com.datadoghq.dd-sdk-android-gradle-plugin"
}

// Environment variables are the machine-local override; tracked Gradle properties provide demo defaults.
def configValue = { String propertyName, String environmentName -> providers.environmentVariable(environmentName).orElse(providers.gradleProperty(propertyName)).get() }

android {
    namespace "dev.kyletaylor.infraadvisor.mobile"
    compileSdk 37

    defaultConfig {
        applicationId "dev.kyletaylor.infraadvisor.mobile"
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "API_BASE_URL", "\"${configValue('infraAdvisorApiBaseUrl', 'INFRA_ADVISOR_API_BASE_URL')}\""
        buildConfigField "String", "DD_SITE", "\"${configValue('datadogSite', 'DD_SITE')}\""
        buildConfigField "String", "DD_ENV", "\"${configValue('datadogEnv', 'DD_ENV')}\""
        buildConfigField "String", "DD_SERVICE", "\"${configValue('datadogService', 'DD_SERVICE')}\""
        buildConfigField "String", "DD_RUM_APPLICATION_ID", "\"${configValue('datadogRumApplicationId', 'DD_RUM_APPLICATION_ID')}\""
        buildConfigField "String", "DD_CLIENT_TOKEN", "\"${configValue('datadogClientToken', 'DD_CLIENT_TOKEN')}\""
        buildConfigField "float", "DD_TRACE_SAMPLE_RATE", "${configValue('datadogTraceSampleRate', 'DD_TRACE_SAMPLE_RATE')}f"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // R8 produces the mapping file consumed by Datadog Error Tracking. Upload credentials
            // are supplied only to the upload task through DATADOG_API_KEY or DD_API_KEY.
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    testOptions { unitTests.returnDefaultValues = true }
}

datadog {
    site = "US3"
    serviceName = configValue('datadogService', 'DD_SERVICE')
    checkProjectDependencies = "warn"
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.android.volley:volley:1.2.1"
    implementation "com.datadoghq:dd-sdk-android-rum:3.11.0"
    implementation "com.datadoghq:dd-sdk-android-logs:3.11.0"
    implementation "com.datadoghq:dd-sdk-android-session-replay:3.11.0"
    implementation "com.datadoghq:dd-sdk-android-trace:3.11.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}
