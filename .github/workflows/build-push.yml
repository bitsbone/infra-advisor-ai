name: Build and push images

on:
  push:
    branches: [main]
    paths:
      # Only trigger when service code or this workflow changes.
      # README, docs/, infra/, .claude/ etc. never trigger a build — except
      # the ACA agentic POC's own Bicep module, since that app deploys via
      # `az deployment sub create`, not `kubectl`, so infra-only changes
      # (env vars, secrets wiring) need to trigger a redeploy too, not just
      # app-code changes. Deliberately narrow (not all of infra/bicep/**) so
      # unrelated infra changes (e.g. AKS node count) don't trigger this.
      - 'services/**'
      - 'k8s/**'
      - 'infra/bicep/modules/aca-agentic-poc.bicep'
      - '.github/workflows/build-push.yml'
      # Airflow builds/deploys via its own deploy-airflow.yml workflow.
      - '!services/ingestion/**'
      - '!k8s/airflow/**'
  workflow_dispatch: # manual full rebuild — always builds all services

env:
  IMAGE_PREFIX: ghcr.io/bitsbone/infra-advisor-ai
  REGISTRY: ghcr.io

jobs:
  # ── Detect which services have changed ─────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mcp-server:         ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mcp-server == 'true' }}
      mcp-server-dotnet:  ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mcp-server-dotnet == 'true' }}
      agent-api:          ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.agent-api == 'true' }}
      agent-api-dotnet:   ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.agent-api-dotnet == 'true' }}
      auth-api:           ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.auth-api == 'true' }}
      load-generator:     ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.load-generator == 'true' }}
      ui:                 ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ui == 'true' }}
      datadog:            ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.datadog == 'true' }}
      aca-agentic-poc-dotnet: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.aca-agentic-poc-dotnet == 'true' }}
      aca-bicep:          ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.aca-bicep == 'true' }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            mcp-server:
              - 'services/mcp-server/**'
              - 'k8s/mcp-server/**'
            mcp-server-dotnet:
              - 'services/mcp-server-dotnet/**'
              - 'k8s/mcp-server-dotnet/**'
            agent-api:
              - 'services/agent-api/**'
              - 'k8s/agent-api/**'
            agent-api-dotnet:
              - 'services/agent-api-dotnet/**'
              - 'k8s/agent-api-dotnet/**'
            auth-api:
              - 'services/auth-api/**'
              - 'k8s/auth-api/**'
            load-generator:
              - 'services/load-generator/**'
              - 'k8s/load-generator/**'
            ui:
              - 'services/ui/**'
              - 'k8s/ui/**'
            datadog:
              - 'datadog/datadog-agent.yaml'
            aca-agentic-poc-dotnet:
              - 'services/aca-agentic-poc-dotnet/**'
            aca-bicep:
              - 'infra/bicep/modules/aca-agentic-poc.bicep'

  # ── Build and push each changed service ────────────────────────────────────
  build:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: mcp-server
            changed: ${{ needs.changes.outputs.mcp-server }}
          - service: mcp-server-dotnet
            changed: ${{ needs.changes.outputs.mcp-server-dotnet }}
          - service: agent-api
            changed: ${{ needs.changes.outputs.agent-api }}
          - service: agent-api-dotnet
            changed: ${{ needs.changes.outputs.agent-api-dotnet }}
          - service: auth-api
            changed: ${{ needs.changes.outputs.auth-api }}
          - service: load-generator
            changed: ${{ needs.changes.outputs.load-generator }}
          - service: ui
            changed: ${{ needs.changes.outputs.ui }}
          - service: aca-agentic-poc-dotnet
            changed: ${{ needs.changes.outputs.aca-agentic-poc-dotnet }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: matrix.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: matrix.changed == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute short SHA
        id: sha
        if: matrix.changed == 'true' && matrix.service == 'ui'
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Collect UI build args
        id: ui-args
        if: matrix.changed == 'true' && matrix.service == 'ui'
        run: |
          {
            echo "args<<EOF"
            echo "VITE_DD_RUM_APP_ID=${{ secrets.VITE_DD_RUM_APP_ID }}"
            echo "VITE_DD_RUM_CLIENT_TOKEN=${{ secrets.VITE_DD_RUM_CLIENT_TOKEN }}"
            echo "VITE_DD_RUM_SITE=${{ secrets.VITE_DD_RUM_SITE || 'us3.datadoghq.com' }}"
            echo "VITE_DD_ENV=${{ vars.DD_ENV || 'dev' }}"
            echo "VITE_APP_VERSION=${{ steps.sha.outputs.short }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Build UI on runner so we can extract sourcemaps before the Docker image is sealed
      - name: Build UI (for sourcemap upload)
        id: ui-build
        if: matrix.changed == 'true' && matrix.service == 'ui'
        working-directory: services/ui
        env:
          VITE_DD_RUM_APP_ID: ${{ secrets.VITE_DD_RUM_APP_ID }}
          VITE_DD_RUM_CLIENT_TOKEN: ${{ secrets.VITE_DD_RUM_CLIENT_TOKEN }}
          VITE_DD_RUM_SITE: ${{ secrets.VITE_DD_RUM_SITE || 'us3.datadoghq.com' }}
          VITE_DD_ENV: ${{ vars.DD_ENV || 'dev' }}
          VITE_APP_VERSION: ${{ steps.sha.outputs.short }}
        run: npm ci && npm run build

      - name: Upload sourcemaps to Datadog
        if: matrix.changed == 'true' && matrix.service == 'ui'
        working-directory: services/ui
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: ${{ secrets.VITE_DD_RUM_SITE || 'us3.datadoghq.com' }}
        run: |
          npx @datadog/datadog-ci sourcemaps upload ./dist \
            --service infra-advisor-ui \
            --release-version "${{ steps.sha.outputs.short }}" \
            --minified-path-prefix "https://infra-advisor-ai.bitsbone.com"

      - name: Build and push
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            DD_GIT_REPOSITORY_URL=https://github.com/bitsbone/infra-advisor-ai
            DD_GIT_COMMIT_SHA=${{ github.sha }}
            ${{ steps.ui-args.outputs.args }}

  # ── Rolling restart on AKS (only if a deployable service was rebuilt) ──────
  deploy:
    needs: [changes, build]
    runs-on: ubuntu-latest
    # Only deploy when at least one of the three long-running services changed.
    # load-generator is a CronJob — it picks up :latest on its next scheduled run.
    # aca-agentic-poc-dotnet is DELIBERATELY excluded — it deploys to Azure
    # Container Apps (see infra/bicep/modules/aca-agentic-poc.bicep), not AKS,
    # so there's no `kubectl set image` step for it here. See the deploy-aca
    # job below for its actual deploy path (az deployment sub create).
    if: |
      github.ref == 'refs/heads/main' && (
        needs.changes.outputs.mcp-server        == 'true' ||
        needs.changes.outputs.mcp-server-dotnet == 'true' ||
        needs.changes.outputs.agent-api         == 'true' ||
        needs.changes.outputs.agent-api-dotnet  == 'true' ||
        needs.changes.outputs.auth-api          == 'true' ||
        needs.changes.outputs.ui                == 'true'
      )
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: 'v0.0.24'

      - name: Get AKS credentials
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AZURE_RG }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Apply k8s manifests for changed services
        # Picks up ConfigMap/Deployment-spec/Service/HPA edits under k8s/<service>/.
        # Previously nothing in CI ever ran this — only a manual `make deploy-k8s`
        # did — so manifest changes (e.g. new ConfigMap keys) could sit committed
        # but never actually reach the cluster until someone remembered to run it
        # by hand. Secrets live under k8s/secrets/ and are never touched here;
        # they're provisioned separately via `make create-*-secret`. Image tags
        # in these manifests are :latest — the next step immediately overrides
        # to the SHA-pinned tag, so this apply never causes an unpinned rollout.
        run: |
          [ "${{ needs.changes.outputs.mcp-server }}" == "true" ]        && kubectl apply -f k8s/mcp-server/
          [ "${{ needs.changes.outputs.mcp-server-dotnet }}" == "true" ] && kubectl apply -f k8s/mcp-server-dotnet/
          [ "${{ needs.changes.outputs.agent-api }}" == "true" ]          && kubectl apply -f k8s/agent-api/
          [ "${{ needs.changes.outputs.agent-api-dotnet }}" == "true" ]   && kubectl apply -f k8s/agent-api-dotnet/
          [ "${{ needs.changes.outputs.auth-api }}" == "true" ]           && kubectl apply -f k8s/auth-api/
          [ "${{ needs.changes.outputs.load-generator }}" == "true" ]     && kubectl apply -f k8s/load-generator/
          [ "${{ needs.changes.outputs.ui }}" == "true" ]                 && kubectl apply -f k8s/ui/
          true  # ensure step always exits 0

      - name: Pin each changed deployment to the just-built image SHA
        # SHA-pinning instead of `kubectl rollout restart` against :latest.
        # Closes the "compromised GHCR :latest tag silently rolls out to every
        # pod on next restart" path called out in security-audit-2026-05-16.md
        # HIGH-3: pods now run a specific git-SHA tag, not whatever happens
        # to be at :latest. Initial apply still uses :latest from the k8s/
        # manifests; CI overrides on every deploy.
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"

          set_image() {
            local dep="$1"
            local container="$2"
            if kubectl get deployment/"$dep" -n infra-advisor &>/dev/null; then
              kubectl set image deployment/"$dep" \
                "$container=$IMAGE_PREFIX/$dep:$SHORT_SHA" \
                -n infra-advisor --record=false
            else
              echo "deployment/$dep not found — skipping (will be applied by make deploy-k8s)"
            fi
          }

          [ "${{ needs.changes.outputs.mcp-server }}" == "true" ]        && set_image mcp-server         mcp-server
          [ "${{ needs.changes.outputs.mcp-server-dotnet }}" == "true" ] && set_image mcp-server-dotnet  mcp-server-dotnet
          [ "${{ needs.changes.outputs.agent-api }}" == "true" ]          && set_image agent-api          agent-api
          [ "${{ needs.changes.outputs.agent-api-dotnet }}" == "true" ]   && set_image agent-api-dotnet   agent-api-dotnet
          [ "${{ needs.changes.outputs.auth-api }}" == "true" ]           && set_image auth-api           auth-api
          [ "${{ needs.changes.outputs.ui }}" == "true" ]                 && set_image ui                 ui
          true  # ensure step always exits 0

      - name: Wait for rollouts
        # Each wait_rollout blocks on `kubectl rollout status` for up to 10m.
        # Previously these ran one after another, so N changed services cost
        # up to N*10m in the worst case even though the rollouts themselves
        # happen concurrently on the cluster. Backgrounding them makes the
        # step's wall-clock cost the SLOWEST single rollout, not the sum —
        # `wait_rollout` already turns a timeout into a warning rather than a
        # failure, so running them in parallel doesn't change pass/fail
        # semantics, only how long we wait to observe the outcome.
        run: |
          wait_rollout() {
            local dep="$1"
            if kubectl get deployment/"$dep" -n infra-advisor &>/dev/null; then
              if kubectl rollout status deployment/"$dep" -n infra-advisor --timeout=10m; then
                echo "OK: $dep rollout finished"
              else
                echo "WARNING: $dep rollout timed out — pod may still be starting in cluster"
              fi
            fi
          }

          pids=()
          [ "${{ needs.changes.outputs.mcp-server }}" == "true" ]        && { wait_rollout mcp-server        & pids+=($!); }
          [ "${{ needs.changes.outputs.mcp-server-dotnet }}" == "true" ] && { wait_rollout mcp-server-dotnet & pids+=($!); }
          [ "${{ needs.changes.outputs.agent-api }}" == "true" ]          && { wait_rollout agent-api          & pids+=($!); }
          [ "${{ needs.changes.outputs.agent-api-dotnet }}" == "true" ]   && { wait_rollout agent-api-dotnet   & pids+=($!); }
          [ "${{ needs.changes.outputs.auth-api }}" == "true" ]           && { wait_rollout auth-api           & pids+=($!); }
          [ "${{ needs.changes.outputs.ui }}" == "true" ]                 && { wait_rollout ui                 & pids+=($!); }

          for pid in "${pids[@]:-}"; do
            wait "$pid" || true
          done

  # ── ACA agentic POC deploy (Azure Container Apps, not AKS) ─────────────────
  deploy-aca:
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' && (
        needs.changes.outputs.aca-agentic-poc-dotnet == 'true' ||
        needs.changes.outputs.aca-bicep == 'true'
      )
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ACA agentic POC
        # acaContainerImage/acaRevisionSuffix are left at their Bicep
        # defaults — :latest (just pushed by the build job above) and a
        # fresh utcNow() timestamp respectively. The suffix is what actually
        # forces a new revision each run; without it ACA sees no diff in
        # the container template (same :latest string every time) and
        # silently skips creating one (confirmed this session).
        run: |
          az deployment sub create \
            --location eastus \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/dev.bicepparam \
            --parameters deployAcaAgenticPoc=true \
            --parameters acaOpenAiApiKey="${{ secrets.AZURE_OPENAI_API_KEY }}" \
            --parameters acaDatadogApiKey="${{ secrets.DD_API_KEY }}" \
            --parameters acaUiUsername="${{ secrets.ACA_UI_USERNAME }}" \
            --parameters acaUiPassword="${{ secrets.ACA_UI_PASSWORD }}" \
            --parameters acaDdRumApplicationId="${{ secrets.VITE_DD_RUM_APP_ID }}" \
            --parameters acaDdRumClientToken="${{ secrets.VITE_DD_RUM_CLIENT_TOKEN }}" \
            --parameters acaDdRumSite="${{ secrets.VITE_DD_RUM_SITE }}"

  # ── Apply DatadogAgent CR (datadog/datadog-agent.yaml changes) ─────────────
  apply-datadog-agent:
    needs: [changes]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.datadog == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: 'v0.0.24'

      - name: Get AKS credentials
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AZURE_RG }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Apply DatadogAgent CR
        run: kubectl apply -f datadog/datadog-agent.yaml
