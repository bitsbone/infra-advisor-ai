name: Build and sync .NET MAUI mobile applications

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: both
        type: choice
        options: [both, android, ios]
      operation:
        description: Build only, upload symbols, or upload symbols and applications
        required: true
        default: build-only
        type: choice
        options: [build-only, upload-symbols, build-and-sync]
      version_name:
        description: Application version
        required: true
        default: 0.1.0
        type: string
      mark_latest:
        description: Mark Mobile App Testing uploads as latest
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  DATADOG_CI_VERSION: 5.21.2
  PROJECT: mobile/cross-platform/maui/src/InfraAdvisor.Mobile/InfraAdvisor.Mobile.csproj
  IOS_BUNDLE_ID: dev.kyletaylor.infraadvisor.maui

jobs:
  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet workload install maui-android
      - uses: actions/setup-node@v6
        if: ${{ inputs.operation != 'build-only' }}
        with:
          node-version: 22
      - name: Install Datadog CLI
        if: ${{ inputs.operation != 'build-only' }}
        run: npm install --global "@datadog/datadog-ci@$DATADOG_CI_VERSION"
      - name: Test
        run: dotnet test mobile/cross-platform/maui/tests/InfraAdvisor.Mobile.Core.Tests/InfraAdvisor.Mobile.Core.Tests.csproj
      - name: Build APK
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
        run: dotnet publish "$PROJECT" -f net10.0-android -c Release -p:InfraAdvisorBuildPlatform=android -p:AndroidPackageFormats=apk -p:ApplicationDisplayVersion="${{ inputs.version_name }}" -p:ApplicationVersion="${{ github.run_number }}" -p:DatadogUploadSymbols=${{ inputs.operation != 'build-only' }}
      - name: Upload APK to Mobile App Testing
        if: ${{ inputs.operation == 'build-and-sync' }}
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          MOBILE_APPLICATION_ID: ${{ vars.DATADOG_SYNTHETICS_MAUI_ANDROID_APPLICATION_ID }}
        run: datadog-ci synthetics upload-application --mobileApplicationId "$MOBILE_APPLICATION_ID" --mobileApplicationVersionFilePath "$(find mobile/cross-platform/maui/src/InfraAdvisor.Mobile/bin/Release/net10.0-android -name '*-Signed.apk' -print -quit)" --versionName "${{ inputs.version_name }} (${{ github.run_number }})" ${{ inputs.mark_latest && '--latest' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: infra-advisor-maui-android-${{ inputs.version_name }}-${{ github.run_number }}
          retention-days: 14
          path: |
            mobile/cross-platform/maui/src/InfraAdvisor.Mobile/bin/Release/net10.0-android/**/*-Signed.apk
            mobile/cross-platform/maui/src/InfraAdvisor.Mobile/bin/Release/net10.0-android/**/mapping.txt

  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet workload install maui-ios
      - uses: actions/setup-node@v6
        if: ${{ inputs.operation != 'build-only' }}
        with:
          node-version: 22
      - name: Install Datadog CLI
        if: ${{ inputs.operation != 'build-only' }}
        run: npm install --global "@datadog/datadog-ci@$DATADOG_CI_VERSION"
      - name: Test
        run: dotnet test mobile/cross-platform/maui/tests/InfraAdvisor.Mobile.Core.Tests/InfraAdvisor.Mobile.Core.Tests.csproj
      - name: Provision Apple signing
        if: ${{ inputs.operation != 'build-only' }}
        uses: maui-actions/apple-provisioning@v4
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAUI_IOS_SIGNING_CERTIFICATE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        with:
          certificate: APPLE_CERTIFICATE
          certificate-passphrase: ${{ secrets.MAUI_IOS_SIGNING_CERTIFICATE_PASSWORD }}
          bundle-identifiers: ${{ env.IOS_BUNDLE_ID }}
          profile-types: IOS_APP_DEVELOPMENT
      - name: Build iOS simulator app
        if: ${{ inputs.operation == 'build-only' }}
        run: dotnet build "$PROJECT" -f net10.0-ios -c Release -p:InfraAdvisorBuildPlatform=ios -p:RuntimeIdentifier=iossimulator-arm64
      - name: Build IPA
        if: ${{ inputs.operation != 'build-only' }}
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
        run: dotnet publish "$PROJECT" -f net10.0-ios -c Release -p:InfraAdvisorBuildPlatform=ios -p:RuntimeIdentifier=ios-arm64 -p:ArchiveOnBuild=true -p:BuildIpa=true -p:ApplicationId="$IOS_BUNDLE_ID" -p:ApplicationDisplayVersion="${{ inputs.version_name }}" -p:ApplicationVersion="${{ github.run_number }}" -p:DatadogUploadSymbols=true
      - name: Upload IPA to Mobile App Testing
        if: ${{ inputs.operation == 'build-and-sync' }}
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          MOBILE_APPLICATION_ID: ${{ vars.DATADOG_SYNTHETICS_MAUI_IOS_APPLICATION_ID }}
        run: datadog-ci synthetics upload-application --mobileApplicationId "$MOBILE_APPLICATION_ID" --mobileApplicationVersionFilePath "$(find mobile/cross-platform/maui/src/InfraAdvisor.Mobile/bin/Release/net10.0-ios -name '*.ipa' -print -quit)" --versionName "${{ inputs.version_name }} (${{ github.run_number }})" ${{ inputs.mark_latest && '--latest' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: infra-advisor-maui-ios-${{ inputs.version_name }}-${{ github.run_number }}
          retention-days: 14
          path: |
            mobile/cross-platform/maui/src/InfraAdvisor.Mobile/bin/Release/net10.0-ios/**/*.app
            mobile/cross-platform/maui/src/InfraAdvisor.Mobile/bin/Release/net10.0-ios/**/*.ipa
            mobile/cross-platform/maui/src/InfraAdvisor.Mobile/bin/Release/net10.0-ios/**/*.dSYM
