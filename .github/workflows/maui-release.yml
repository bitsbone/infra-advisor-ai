name: Build and sync .NET MAUI mobile applications

on:
  workflow_dispatch:
    inputs:
      platform:
        description: MAUI target to build
        required: true
        default: both
        type: choice
        options: [both, android, ios]
      operation:
        description: Build only or upload matching symbols and application to Datadog
        required: true
        default: build-only
        type: choice
        options: [build-only, build-and-sync]
      version_name:
        description: Semantic application version
        required: true
        default: 0.1.0
        type: string
      mark_latest:
        description: Make the uploaded Mobile App Testing version latest
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: maui-release-${{ inputs.platform }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  DATADOG_CI_VERSION: 5.21.2
  DATADOG_SITE: us3.datadoghq.com
  PROJECT: mobile/cross-platform/maui/src/InfraAdvisor.Mobile/InfraAdvisor.Mobile.csproj

jobs:
  android:
    name: MAUI Android release
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Validate signing and Datadog configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.MAUI_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MAUI_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MAUI_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MAUI_ANDROID_KEY_PASSWORD }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          MOBILE_APPLICATION_ID: ${{ vars.DATADOG_SYNTHETICS_MAUI_ANDROID_APPLICATION_ID }}
          SYNC: ${{ inputs.operation == 'build-and-sync' }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do [[ -n "${!name:-}" ]] || { echo "Missing $name" >&2; exit 1; }; done
          if [[ "$SYNC" == "true" ]]; then for name in DD_API_KEY DD_APP_KEY MOBILE_APPLICATION_ID; do [[ -n "${!name:-}" ]] || { echo "Missing $name" >&2; exit 1; }; done; fi
      - name: Decode Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.MAUI_ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maui-android.keystore"
      - name: Test shared contracts
        run: dotnet test mobile/cross-platform/maui/tests/InfraAdvisor.Mobile.Core.Tests/InfraAdvisor.Mobile.Core.Tests.csproj
      - name: Publish signed Android application and matching mapping
        shell: bash
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MAUI_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MAUI_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MAUI_ANDROID_KEY_PASSWORD }}
          SYNC: ${{ inputs.operation == 'build-and-sync' }}
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT" -f net10.0-android -c Release -p:ApplicationDisplayVersion="${{ inputs.version_name }}" -p:ApplicationVersion="$GITHUB_RUN_NUMBER" -p:AndroidPackageFormat=apk -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/maui-android.keystore" -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD -p:DatadogUploadSymbols="$SYNC"
          apk_path="$(find mobile/cross-platform/maui/src/InfraAdvisor.Mobile/bin/Release/net10.0-android -name '*-Signed.apk' -type f | head -1)"
          mapping_path="$(find mobile/cross-platform/maui/src/InfraAdvisor.Mobile -name mapping.txt -type f | head -1)"
          [[ -n "$apk_path" && -n "$mapping_path" ]] || { echo "Expected APK or R8 mapping was not generated." >&2; exit 1; }
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"
          echo "MAPPING_PATH=$mapping_path" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        if: ${{ inputs.operation == 'build-and-sync' }}
        with:
          node-version: 22
      - name: Upload Android application to Mobile App Testing
        if: ${{ inputs.operation == 'build-and-sync' }}
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          MOBILE_APPLICATION_ID: ${{ vars.DATADOG_SYNTHETICS_MAUI_ANDROID_APPLICATION_ID }}
          MARK_LATEST: ${{ inputs.mark_latest }}
        run: |
          set -euo pipefail
          latest=(); [[ "$MARK_LATEST" == "true" ]] && latest+=(--latest)
          npx --yes "@datadog/datadog-ci@$DATADOG_CI_VERSION" synthetics upload-application --mobileApplicationId "$MOBILE_APPLICATION_ID" --mobileApplicationVersionFilePath "$APK_PATH" --versionName "${{ inputs.version_name }} ($GITHUB_RUN_NUMBER)" "${latest[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: infra-advisor-maui-android-${{ inputs.version_name }}-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ env.APK_PATH }}
            ${{ env.MAPPING_PATH }}
      - name: Remove Android signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/maui-android.keystore"

  ios:
    name: MAUI iOS release
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios
      - name: Validate signing and Datadog configuration
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.MAUI_IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.MAUI_IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.MAUI_IOS_PROVISIONING_PROFILE_BASE64 }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          MOBILE_APPLICATION_ID: ${{ vars.DATADOG_SYNTHETICS_MAUI_IOS_APPLICATION_ID }}
          SYNC: ${{ inputs.operation == 'build-and-sync' }}
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROFILE_BASE64; do [[ -n "${!name:-}" ]] || { echo "Missing $name" >&2; exit 1; }; done
          if [[ "$SYNC" == "true" ]]; then for name in DD_API_KEY DD_APP_KEY MOBILE_APPLICATION_ID; do [[ -n "${!name:-}" ]] || { echo "Missing $name" >&2; exit 1; }; done; fi
      - name: Install iOS development signing assets
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.MAUI_IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.MAUI_IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.MAUI_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/maui-ios.p12"; profile="$RUNNER_TEMP/maui-ios.mobileprovision"; keychain="$RUNNER_TEMP/maui-ios.keychain-db"; keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$cert"; printf '%s' "$IOS_PROFILE_BASE64" | base64 -D > "$profile"
          security create-keychain -p "$keychain_password" "$keychain"; security unlock-keychain -p "$keychain_password" "$keychain"; security import "$cert" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"; security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"; security list-keychains -d user -s "$keychain"
          security cms -D -i "$profile" > "$RUNNER_TEMP/maui-ios-profile.plist"; profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/maui-ios-profile.plist")"; profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/maui-ios-profile.plist")"; mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"; cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          codesign_key="$(security find-identity -v -p codesigning "$keychain" | sed -n '1s/.*"\(.*\)".*/\1/p')"; [[ -n "$codesign_key" ]] || { echo "No signing identity imported." >&2; exit 1; }
          echo "MAUI_IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"; echo "MAUI_IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"; echo "MAUI_IOS_CODESIGN_KEY=$codesign_key" >> "$GITHUB_ENV"; echo "MAUI_IOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Test shared contracts
        run: dotnet test mobile/cross-platform/maui/tests/InfraAdvisor.Mobile.Core.Tests/InfraAdvisor.Mobile.Core.Tests.csproj
      - name: Publish signed iOS IPA and matching dSYMs
        shell: bash
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          SYNC: ${{ inputs.operation == 'build-and-sync' }}
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT" -f net10.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:ArchiveOnBuild=true -p:BuildIpa=true -p:ApplicationDisplayVersion="${{ inputs.version_name }}" -p:ApplicationVersion="$GITHUB_RUN_NUMBER" -p:CodesignKey="$MAUI_IOS_CODESIGN_KEY" -p:CodesignProvision="$MAUI_IOS_PROFILE_NAME" -p:DatadogUploadSymbols="$SYNC"
          ipa_path="$(find mobile/cross-platform/maui/src/InfraAdvisor.Mobile/bin/Release/net10.0-ios -name '*.ipa' -type f | head -1)"; dsym_path="$(find mobile/cross-platform/maui/src/InfraAdvisor.Mobile/bin/Release/net10.0-ios -name '*.dSYM' -type d | head -1)"
          [[ -n "$ipa_path" && -n "$dsym_path" ]] || { echo "Expected IPA or dSYM was not generated." >&2; exit 1; }
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"; echo "DSYM_PATH=$dsym_path" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        if: ${{ inputs.operation == 'build-and-sync' }}
        with:
          node-version: 22
      - name: Upload iOS application to Mobile App Testing
        if: ${{ inputs.operation == 'build-and-sync' }}
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          MOBILE_APPLICATION_ID: ${{ vars.DATADOG_SYNTHETICS_MAUI_IOS_APPLICATION_ID }}
          MARK_LATEST: ${{ inputs.mark_latest }}
        run: |
          set -euo pipefail
          latest=(); [[ "$MARK_LATEST" == "true" ]] && latest+=(--latest)
          npx --yes "@datadog/datadog-ci@$DATADOG_CI_VERSION" synthetics upload-application --mobileApplicationId "$MOBILE_APPLICATION_ID" --mobileApplicationVersionFilePath "$IPA_PATH" --versionName "${{ inputs.version_name }} ($GITHUB_RUN_NUMBER)" "${latest[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: infra-advisor-maui-ios-${{ inputs.version_name }}-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.DSYM_PATH }}
      - name: Remove iOS signing assets
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/maui-ios.p12" "$RUNNER_TEMP/maui-ios.mobileprovision" "$RUNNER_TEMP/maui-ios-profile.plist"
          [[ -z "${MAUI_IOS_PROFILE_UUID:-}" ]] || rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$MAUI_IOS_PROFILE_UUID.mobileprovision"
          [[ -z "${MAUI_IOS_KEYCHAIN:-}" ]] || security delete-keychain "$MAUI_IOS_KEYCHAIN" || true
