name: Build and deploy Airflow

# Split out from build-push.yml: the Airflow Helm upgrade fails independently
# of every other service (its own preflight/migration-state issues), and
# bundling it into the main pipeline made every run's overall conclusion red
# even when all other services built and deployed cleanly. This workflow's
# own failures no longer affect build-push.yml's status.

on:
  push:
    branches: [main]
    paths:
      - 'k8s/airflow/**'
      - 'services/ingestion/**'
      - '.github/workflows/deploy-airflow.yml'
  workflow_dispatch: # manual rebuild + upgrade

env:
  IMAGE_PREFIX: ghcr.io/bitsbone/infra-advisor-ai
  REGISTRY: ghcr.io

jobs:
  # ── Airflow uses a custom image containing locked dependencies, DAGs, and the
  # helper scripts imported by knowledge_base_init and public_docs_ingestion.
  build-airflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: airflow-meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/airflow
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: services/ingestion
          load: true
          push: false
          tags: ${{ steps.airflow-meta.outputs.tags }}
          labels: ${{ steps.airflow-meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow

      - name: Verify Airflow image contract before publishing
        run: |
          docker run --rm \
            --env DD_TRACE_ENABLED=false \
            "${IMAGE_PREFIX}/airflow:${GITHUB_SHA}" \
            python /opt/airflow/scripts/verify_image_contract.py

      - name: Publish verified Airflow image
        run: |
          docker push "${IMAGE_PREFIX}/airflow:${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker push "${IMAGE_PREFIX}/airflow:latest"
          fi

  upgrade-airflow:
    needs: build-airflow
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: 'v0.0.24'

      - name: Get AKS credentials
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AZURE_RG }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Add Airflow Helm repo
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Helm upgrade Airflow
        run: |
          # A failed/pending or mixed-image release requires an operator-reviewed
          # metadata backup and recovery. Automatically stacking another rollback
          # or upgrade can leave stateful and deployment workloads on different
          # Airflow schema versions.
          services/ingestion/scripts/cluster_preflight.sh
          helm upgrade airflow apache-airflow/airflow \
            --version 1.21.0 \
            --namespace airflow \
            --values k8s/airflow/values.yaml \
            --set images.airflow.repository="${IMAGE_PREFIX}/airflow" \
            --set images.airflow.tag="${GITHUB_SHA}" \
            --set createUserJob.enabled=false \
            --timeout 10m \
            --wait \
            --wait-for-jobs \
            --cleanup-on-fail \
            --atomic
          EXPECTED_AIRFLOW_IMAGE="${IMAGE_PREFIX}/airflow:${GITHUB_SHA}" services/ingestion/scripts/cluster_preflight.sh
