<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ACA Agentic POC</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
  input[type=text] { flex: 1; padding: 0.5rem; font-size: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  #answer { white-space: pre-wrap; padding: 1rem; background: #f4f4f4; border-radius: 4px; min-height: 2rem; }
  #status { color: #666; font-size: 0.9rem; }
  #trace-link { display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 0.75rem; font-size: 0.85rem; color: #632ca6; text-decoration: none; }
  #trace-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>ACA Agentic POC</h1>
  <p id="status">Ask the agent something — it can check the current UTC time or search the web.</p>
  <form id="chat-form">
    <input type="text" id="query" placeholder="What time is it?" autocomplete="off" required />
    <button type="submit">Send</button>
  </form>
  <div id="answer"></div>
  <a id="trace-link" href="#" target="_blank" rel="noopener" style="display: none;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
      <polyline points="15 3 21 3 21 9" />
      <line x1="10" y1="14" x2="21" y2="3" />
    </svg>
    View APM trace
  </a>

  <!-- Chat handling lives in its own script, independent of RUM below, so a
       RUM load/init failure can never break the chat UI (this bit us once:
       an old blocking <script src> + inline init in one block meant an
       uncaught RUM error aborted the form listener setup too, silently
       falling back to a native form POST/page-reload). -->
  <script>
    const form = document.getElementById("chat-form");
    const answerEl = document.getElementById("answer");
    const statusEl = document.getElementById("status");
    const traceLinkEl = document.getElementById("trace-link");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = document.getElementById("query").value;
      statusEl.textContent = "Thinking...";
      answerEl.textContent = "";
      traceLinkEl.style.display = "none";
      try {
        const res = await fetch("/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        answerEl.textContent = data.answer;
        statusEl.textContent = "";
        if (data.traceUrl) {
          traceLinkEl.href = data.traceUrl;
          traceLinkEl.style.display = "inline-flex";
        }
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      }
    });
  </script>

  <script src="/rum-config.js"></script>
  <script>
    (function(h,o,u,n,d) {
      h=h[d]=h[d]||{q:[],onReady:function(c){h.q.push(c)}}
      d=o.createElement(u);d.async=1;d.src=n;d.crossOrigin=''
      n=o.getElementsByTagName(u)[0];n.parentNode.insertBefore(d,n)
    })(window,document,'script','https://www.datadoghq-browser-agent.com/us3/v7/datadog-rum.js','DD_RUM')
    window.DD_RUM.onReady(function() {
      if (!window.DD_RUM_CONFIG) return;
      window.DD_RUM.init({
        applicationId: window.DD_RUM_CONFIG.applicationId,
        clientToken: window.DD_RUM_CONFIG.clientToken,
        site: window.DD_RUM_CONFIG.site,
        service: window.DD_RUM_CONFIG.service,
        env: window.DD_RUM_CONFIG.env,
        version: window.DD_RUM_CONFIG.version,
        sessionSampleRate: 100,
        sessionReplaySampleRate: 100,
        trackResources: true,
        trackUserInteractions: true,
        trackLongTasks: true,
        defaultPrivacyLevel: "mask-user-input",
        allowedTracingUrls: [window.location.origin],
      });
    });
  </script>
</body>
</html>
