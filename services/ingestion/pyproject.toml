[project]
name = "infra-advisor-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Keep the application dependency aligned with the pinned base image.
    "apache-airflow==3.2.1",
    "apache-airflow-providers-http>=6.0.0",
    # DJM: Datadog Transport requires >= 2.7.3; openlineage-python >= 1.37.0
    "apache-airflow-providers-openlineage>=2.7.3",
    "openlineage-python>=1.37.0",
    "azure-storage-blob>=12.28.0",
    "azure-search-documents>=11.6.0",
    "azure-identity>=1.25.3",
    "tiktoken>=0.12.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3,<3",
    # Pandas needs an explicit Parquet engine; it is not bundled with pandas.
    "pyarrow>=21.0.0",
    "openai>=2.32.0",
    # ddtrace 4.x bundles all integrations — no separate extras needed
    "ddtrace>=4.11.1",
    "httpx>=0.28.1",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0,<=6.0.2",
]

[tool.uv]
# The official Airflow image includes optional provider dependencies that are
# outside this project's direct graph. Keep uv's sealed layer compatible with
# those installed distributions; the runtime contract independently verifies
# every installed requirement after the image is assembled.
constraint-dependencies = [
    "cryptography>=46,<47",
    "fsspec==2026.3.0",
    "rich<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.0",
    "ruff>=0.15.11",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
