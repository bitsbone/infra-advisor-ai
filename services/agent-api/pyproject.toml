[project]
name = "agent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # ddtrace 4.x bundles all integrations — no separate extras needed.
    # Pinned EXACTLY to a pre-release: LLMObs.annotate() gained audio_parts
    # in 4.12.0 (stable) but image_parts only exists in 4.13.0rc3 as of this
    # writing — no stable 4.13.0 release yet. Chosen deliberately for this
    # showcase app to demonstrate both; re-pin to the stable 4.13.0 (or
    # later) release once one exists, verifying the schema hasn't changed.
    "ddtrace==4.13.0rc3",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "langchain>=1.2.0",
    "langgraph>=0.2.23",
    "langchain-openai>=1.1.0",
    "langchain-mcp-adapters>=0.2.0",
    "openai>=2.32.0",
    "pydantic>=2.13.0",
    "redis>=7.4.0",
    "uvicorn[standard]>=0.44.0",
    "confluent-kafka>=2.14.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # JWT validation (same JWT_SECRET as auth-api) for /query auth
    "python-jose[cryptography]>=3.3.0",
    # Per-IP + per-user rate limiting on expensive LLM endpoints
    "slowapi>=0.1.9",
    # Chat attachment storage (POST /media/upload) — blob upload + SAS signing
    "azure-storage-blob>=12.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
